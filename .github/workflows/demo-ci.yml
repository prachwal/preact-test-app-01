name: Demo CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  # Base URL for GitHub Pages deployment
  VITE_BASE_URL: '/preact-test-app-01/'

jobs:
  # Simple test and build pipeline
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build
        env:
          VITE_BASE_URL: ${{ env.VITE_BASE_URL }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Check for symlinks and hard links in build output
        run: |
          echo "Checking for symlinks in dist/"
          if find dist/ -type l | grep -q .; then
            echo "Found symlinks:"
            find dist/ -type l
            echo "Removing symlinks..."
            find dist/ -type l -delete
          else
            echo "No symlinks found"
          fi
          
          echo "Checking for hard links in dist/"
          if find dist/ -type f -links +1 | grep -q .; then
            echo "Found hard links:"
            find dist/ -type f -links +1
            echo "Copying hard linked files to break links..."
            # Create a temporary directory and copy all files, breaking hard links
            mkdir -p dist_temp
            cp -r dist/* dist_temp/
            rm -rf dist
            mv dist_temp dist
          else
            echo "No hard links found"
          fi

      - name: Add .nojekyll file for GitHub Pages
        run: touch dist/.nojekyll

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # Simple deployment to GitHub Pages (for demo)
  deploy:
    name: Deploy Demo
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project for deployment
        run: npm run build
        env:
          VITE_BASE_URL: ${{ env.VITE_BASE_URL }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Check for symlinks and hard links in build output
        run: |
          echo "Checking for symlinks in dist/"
          if find dist/ -type l | grep -q .; then
            echo "Found symlinks:"
            find dist/ -type l
            echo "Removing symlinks..."
            find dist/ -type l -delete
          else
            echo "No symlinks found"
          fi
          
          echo "Checking for hard links in dist/"
          if find dist/ -type f -links +1 | grep -q .; then
            echo "Found hard links:"
            find dist/ -type f -links +1
            echo "Copying hard linked files to break links..."
            # Create a temporary directory and copy all files, breaking hard links
            mkdir -p dist_temp
            cp -r dist/* dist_temp/
            rm -rf dist
            mv dist_temp dist
          else
            echo "No hard links found"
          fi

      - name: Add .nojekyll file for GitHub Pages
        run: touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/
          cname: false

  # Basic security check (lightweight)
  security-check:
    name: Basic Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quick security audit
        run: npm audit --audit-level moderate
        continue-on-error: true